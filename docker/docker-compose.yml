version: "3.8"

services:
  ai-customer-service-platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai_customer_service_platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - SQLITE_DB_PATH=/app/data/tickets.db
    volumes:
      - platform-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  platform-data:
    driver: local
